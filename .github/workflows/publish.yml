name: Build and publish
on:
  workflow_dispatch:
    inputs:
      PackageVersion:
        description: "Package Version"
        required: true

jobs:
  publish:
    permissions:
      id-token: write
    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'ApiFootball'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: |
            8.x
            
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: Build
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIG -p:Version=${{ github.event.inputs.PackageVersion }}

      - name: Publish
        run: dotnet nuget push **\*.nupkg -s 'https://api.nuget.org/v3/index.json' --api-key ${{steps.login.outputs.NUGET_API_KEY}}
